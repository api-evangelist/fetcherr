aid: fetcherr
name: Fetcherr
description: >-
  Fetcherr is an Israel-based AI technology company (founded 2019, Netanya)
  building generative-AI decision systems for the aviation industry. Its core
  is the Large Market Model (LMM), a generative model trained on internal
  airline data plus external signals (competitor prices, demand, weather,
  events, economic indicators) to forecast markets and drive real-time
  business decisions. Fetcherr productizes the LMM as a Generative Pricing
  Engine (GPE) for dynamic airline pricing and as ALPHA, a cloud-based
  retailing and inventory-management platform that integrates with existing
  airline PSS and legacy infrastructure. Customers include Delta, Virgin
  Atlantic, WestJet, Azul, and Viva Aerobus. Fetcherr is an enterprise B2B
  vendor and does not publish a public developer portal, API documentation,
  SDKs, or self-serve credentials; integration is delivered directly to
  airline customers. Added to the API Evangelist network as a
  battery-ventures portfolio company.
